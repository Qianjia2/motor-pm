<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>智能问答助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;padding:16px 20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
header h1{font-size:18px;font-weight:600;color:#1f2937}
header p{font-size:12px;color:#9ca3af;margin-top:4px}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:700px;width:100%;margin:0 auto}
.msg{display:flex;margin-bottom:16px;animation:fadeIn .3s}
.msg.user{justify-content:flex-end}
.msg.assistant{gap:8px}
.msg .bubble{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.7;word-break:break-word}
.msg.user .bubble{background:#3b82f6;color:#fff;border-bottom-right-radius:2px}
.msg.assistant .bubble{background:#fff;color:#1f2937;border-bottom-left-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg .avatar{width:30px;height:30px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg .sources{font-size:10px;color:#9ca3af;margin-top:4px;padding-left:38px}
.welcome{text-align:center;padding:60px 20px;color:#9ca3af}
.welcome .icon{font-size:56px;margin-bottom:16px}
.welcome .title{font-size:16px;font-weight:600;color:#6b7280;margin-bottom:8px}
.typing{display:flex;gap:8px;margin-bottom:16px}
.typing .bubble{padding:8px 16px;font-size:14px;color:#9ca3af}
.typing .bubble span{animation:blink 1.4s infinite;font-size:20px}
.typing .bubble span:nth-child(2){animation-delay:.2s}
.typing .bubble span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
footer{background:#fff;padding:12px 16px;box-shadow:0 -1px 3px rgba(0,0,0,.05)}
footer .input-row{display:flex;gap:8px;max-width:700px;margin:0 auto}
footer input{flex:1;padding:10px 16px;border:1px solid #e5e7eb;border-radius:20px;font-size:14px;outline:none}
footer input:focus{border-color:#3b82f6}
footer button{background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:20px;font-size:14px;cursor:pointer;font-weight:500}
footer button:disabled{background:#9ca3af;cursor:not-allowed}
footer .hint{text-align:center;font-size:10px;color:#d1d5db;margin-top:6px}
.error{text-align:center;padding:60px 20px}
.error .code{font-size:48px;font-weight:700;color:#ef4444}
.error .msg{font-size:14px;color:#6b7280;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1 id="title">智能问答助手</h1>
  <p id="welcome">正在连接...</p>
</header>
<div id="chat"></div>
<div id="typing" class="typing" style="display:none"><div style="max-width:700px;width:100%;margin:0 auto;display:flex;gap:8px;padding:0 16px"><div class="avatar">🤖</div><div class="bubble"><span>●</span><span>●</span><span>●</span></div></div></div>
<footer>
  <div class="input-row">
    <input id="input" type="text" placeholder="输入问题..." disabled>
    <button id="sendBtn" disabled>发送</button>
  </div>
  <div class="hint">AI知识库提供支持 · 回答仅供参考</div>
</footer>

<script>
const token = location.pathname.split('/').pop();
const API = '/api/public/kb/' + token;

let info = null;

async function init() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('链接已失效');
    info = await r.json();
    document.getElementById('title').textContent = info.name || '智能问答助手';
    document.getElementById('welcome').textContent = info.welcome || '您好，有什么可以帮助您的？';
    document.getElementById('input').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('input').placeholder = '输入问题...';
  } catch(e) {
    document.getElementById('chat').innerHTML = `<div class="error"><div class="code">😞</div><div class="msg">分享链接不存在或已停用</div></div>`;
  }
}

function addMsg(role, content, sources) {
  const chat = document.getElementById('chat');
  if (role === 'user') {
    chat.innerHTML += `<div class="msg user"><div class="bubble">${esc(content)}</div></div>`;
  } else {
    let srcHtml = '';
    if (sources && sources.length) {
      srcHtml = `<div class="sources">参考: ${sources.map(esc).join(' · ')}</div>`;
    }
    chat.innerHTML += `<div class="msg assistant"><div class="avatar">🤖</div><div><div class="bubble">${esc(content)}</div>${srcHtml}</div></div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function send() {
  const input = document.getElementById('input');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';

  addMsg('user', q);
  document.getElementById('typing').style.display = 'block';
  document.getElementById('sendBtn').disabled = true;

  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, history: []})
    });
    const data = await r.json();
    addMsg('assistant', data.answer || '无回答', data.sources);
  } catch(e) {
    addMsg('assistant', '抱歉，服务暂时不可用，请稍后重试。');
  }

  document.getElementById('typing').style.display = 'none';
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
init();
</script>
</body>
</html>

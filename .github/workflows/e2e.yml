name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend_v2/requirements.txt

      - name: Install backend deps
        run: pip install -r backend_v2/requirements.txt

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install E2E deps + Chromium
        run: |
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Seed database
        run: |
          mkdir -p data
          python -m backend_v2.seed

      - name: Start backend
        env:
          UPLOAD_DIR: /tmp/motorpm-uploads
          DATA_DIR: /tmp/motorpm-data
        run: |
          mkdir -p /tmp/motorpm-uploads /tmp/motorpm-data
          nohup python -m uvicorn backend_v2.main:app --host 127.0.0.1 --port 5002 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5002/api/health && exit 0 || sleep 1
          done
          echo "backend did not become healthy" && cat /tmp/backend.log && exit 1

      - name: Run E2E suites
        run: python e2e/run_all.py

      - name: Upload logs & exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/output/
          retention-days: 7
